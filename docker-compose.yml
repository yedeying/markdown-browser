version: "3.8"

services:
  vmd:
    build:
      context: .
      dockerfile: Dockerfile
    image: vmd:latest
    container_name: vmd-server
    ports:
      - "8197:8888"
    volumes:
      # 挂载宿主机工作区（根目录）到容器 /workspace
      # 容器内通过 .vmd-config.json 选择工作区内的子目录作为"挂载点"
      # 兼容旧变量 VMD_WORKDIR
      - ${VMD_WORKSPACE:-${VMD_WORKDIR:-/home/private}}:/workspace
    environment:
      DOCKER_CONTAINER: "true"
      TZ: Asia/Shanghai
      # 访问密码已取消：整站由 Authelia 前置认证保护（见 traefik labels）
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 256M
    # 健康检查
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8888').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 重启策略
    restart: unless-stopped
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.vmd.rule=Host(`vmd.yedeying.top`) || Host(`vmd-raw.yedeying.top`)
      - traefik.http.routers.vmd.entrypoints=websecure
      - traefik.http.routers.vmd.tls=true
      - traefik.http.routers.vmd.service=vmd
      - traefik.http.services.vmd.loadbalancer.server.port=8888
      - traefik.docker.network=traefik
      - homepage.group=主页
      - homepage.name=VMD
      - homepage.icon=https://simpleicons.org/icons/markdown.svg
      - homepage.href=https://vmd.yedeying.top
      - homepage.weight=31
    # 容器日志
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
